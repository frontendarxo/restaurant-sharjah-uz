# Static site: no build step, publish the repository root.
[build]
  publish = "."
  command = ""

[functions]
  directory = "netlify/functions"

# Keys come from environment variables through a function (assets/config.js is not in git).
[[redirects]]
  from = "/assets/config.js"
  to = "/.netlify/functions/config"
  status = 200

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
