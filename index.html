<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Samarkand Restaurant · Sharjah</title>
<meta name="description" content="Uzbek and Central Asian restaurant in Al Majaz, Sharjah. Plov, manti, tandoor samsa, lagman and shashlik. Open daily 09:00–01:00. Order on WhatsApp 058 592 3773.">
<meta name="theme-color" content="#1f4b66">
<link rel="icon" href="assets/brand/icon-180.png">
<link rel="apple-touch-icon" href="assets/brand/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Montserrat:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap">
<style>
/* Layout: indigo-and-cream page built on the Samarkand Madina design system — arch frames (Registan pishtaq), dish cut-outs on sand, one red "order" action per screen. */
:root{
  --paper:#f5eede; --paper-raised:#fbf7ee; --sand:#e9dcc2; --hairline:#d6c8ac;
  --ink:#1a2a33; --ink-muted:#525e61;
  --indigo:#1f4b66; --on-indigo:#f5eede; --cobalt:#2350b8;
  --pomegranate:#b3303a; --on-pomegranate:#ffffff; --saffron:#d9962b; --on-saffron:#1a2a33;
  --focus:#2350b8;
  --font-display:"Forum","Cormorant Garamond",Georgia,serif;
  --font-sans:"Montserrat","Helvetica Neue",Arial,sans-serif;
  --font-arabic:"Noto Kufi Arabic","Geeza Pro",Tahoma,sans-serif;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-6:24px; --space-8:32px; --space-12:48px; --space-16:64px;
  --radius-sm:10px; --radius-md:18px; --radius-lg:28px; --radius-arch:160px; --radius-pill:999px;
  --shadow-sheet:0 -10px 30px rgba(26,42,51,.10); --shadow-lift:0 14px 28px -14px rgba(31,75,102,.45);
  --gutter:max(16px, env(safe-area-inset-left,0px));
  --gutter-r:max(16px, env(safe-area-inset-right,0px));
  --maxw:1180px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0f2230; --paper-raised:#163041; --sand:#21404f; --hairline:#2d4d5d;
  --ink:#f2eadb; --ink-muted:#a8b3b4; --indigo:#9cc3da; --on-indigo:#0f2230; --cobalt:#8faef0;
  --pomegranate:#f27880; --on-pomegranate:#1a0e0f; --saffron:#e9b04f; --on-saffron:#0f2230; --focus:#8faef0;
  --shadow-sheet:0 -10px 30px rgba(0,0,0,.45); --shadow-lift:0 14px 28px -12px rgba(0,0,0,.6);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0f2230; --paper-raised:#163041; --sand:#21404f; --hairline:#2d4d5d;
  --ink:#f2eadb; --ink-muted:#a8b3b4; --indigo:#9cc3da; --on-indigo:#0f2230; --cobalt:#8faef0;
  --pomegranate:#f27880; --on-pomegranate:#1a0e0f; --saffron:#e9b04f; --on-saffron:#0f2230; --focus:#8faef0;
  --shadow-sheet:0 -10px 30px rgba(0,0,0,.45); --shadow-lift:0 14px 28px -12px rgba(0,0,0,.6);
  color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth; scroll-padding-top:150px}
body{margin:0; background:var(--paper); color:var(--ink); font:400 15px/24px var(--font-sans); -webkit-font-smoothing:antialiased; padding-bottom:env(safe-area-inset-bottom,0px)}
html[lang="ar"] body{font-family:var(--font-arabic)}
img{max-width:100%; display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}
.wrap{max-width:var(--maxw); margin:0 auto; padding-left:var(--gutter); padding-right:var(--gutter-r)}
.label{font:600 11px/14px var(--font-sans); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-muted)}
html[lang="ar"] .label{letter-spacing:0; font-family:var(--font-arabic); font-size:12px}
h1,h2,h3{font-family:var(--font-display); font-weight:400; margin:0; text-wrap:balance}
html[lang="ar"] h1, html[lang="ar"] h2, html[lang="ar"] h3{font-family:var(--font-arabic); font-weight:600}
.muted{color:var(--ink-muted)}
.mask{display:block; background:var(--indigo); -webkit-mask:var(--m) center/contain no-repeat; mask:var(--m) center/contain no-repeat}
.wordmark{--m:url(assets/brand/wordmark-ink.png); aspect-ratio:709/242}
.ornament{--m:url(assets/brand/ornament-ink.png); aspect-ratio:3/1}
.ico{width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round}

/* concept ribbon */
.ribbon{background:var(--ink); color:var(--paper); font:500 12px/1.4 var(--font-sans); text-align:center; padding:6px var(--gutter-r) 6px var(--gutter)}
.ribbon a{color:inherit; text-underline-offset:2px}
html[lang="ar"] .ribbon{font-family:var(--font-arabic)}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:var(--space-2); min-height:48px; padding:0 var(--space-6); border-radius:var(--radius-pill); border:1.5px solid transparent; font:600 15px/1 var(--font-sans); text-decoration:none; cursor:pointer; transition:transform .15s ease, box-shadow .15s ease; white-space:nowrap}
html[lang="ar"] .btn{font-family:var(--font-arabic)}
.btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-lift)}
.btn-order{background:var(--pomegranate); color:var(--on-pomegranate)}
.btn-primary{background:var(--indigo); color:var(--on-indigo)}
.btn-ghost{background:transparent; color:var(--indigo); border-color:var(--hairline)}
.btn-sm{min-height:38px; padding:0 var(--space-4); font-size:13px}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none; box-shadow:none}
.stepper button:disabled{opacity:.35; cursor:not-allowed}
.badge{display:inline-flex; align-items:center; gap:4px; height:24px; padding:0 10px; border-radius:var(--radius-pill); font:600 11px/1 var(--font-sans); white-space:nowrap}
html[lang="ar"] .badge{font-family:var(--font-arabic)}
.badge .ico{width:13px; height:13px; stroke-width:2}
.b-fried{background:var(--pomegranate); color:var(--on-pomegranate)}
.b-hit{background:var(--saffron); color:var(--on-saffron)}
.b-soft{background:var(--paper-raised); color:var(--ink)}
.b-off{background:var(--ink); color:var(--paper)}
.dish.off .dish-photo img, .dish.off .ph{opacity:.4; filter:grayscale(1)}
.dish.off .price{color:var(--ink-muted); text-decoration:line-through}

/* header */
header.top{position:sticky; top:0; z-index:30; background:color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-bottom:1px solid transparent; transition:border-color .2s}
header.top.scrolled{border-bottom-color:var(--hairline)}
.top-in{display:flex; align-items:center; gap:var(--space-6); height:68px}
.top .wordmark{width:112px}
.nav{display:flex; gap:var(--space-6); margin-inline-start:auto}
.nav a{font:500 14px/1 var(--font-sans); text-decoration:none; color:var(--ink)}
html[lang="ar"] .nav a{font-family:var(--font-arabic)}
.nav a:hover{color:var(--indigo)}
.langs{display:flex; border:1px solid var(--hairline); border-radius:var(--radius-pill); padding:3px}
.langs button{border:0; background:none; color:var(--ink-muted); font:600 12px/1 var(--font-sans); padding:7px 10px; border-radius:var(--radius-pill); cursor:pointer}
.langs button[lang="ar"]{font-family:var(--font-arabic)}
.langs button[aria-pressed="true"]{background:var(--indigo); color:var(--on-indigo)}

/* hero */
.hero{position:relative; overflow:hidden}
.hero-in{display:grid; grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr); gap:var(--space-12); align-items:center; padding-block:var(--space-12) var(--space-16)}
.hero h1{font-size:clamp(44px,6.2vw,76px); line-height:.98; color:var(--indigo); margin-top:var(--space-4)}
html[lang="ar"] .hero h1{font-size:clamp(36px,5vw,60px); line-height:1.25}
.hero p.lead{font-size:17px; line-height:28px; max-width:34em; margin:var(--space-6) 0 0; color:var(--ink)}
.hero-ctas{display:flex; flex-wrap:wrap; gap:var(--space-3); margin-top:var(--space-8)}
.hero-facts{display:flex; flex-wrap:wrap; gap:var(--space-6); margin-top:var(--space-8); align-items:center}
.rating{display:inline-flex; align-items:center; gap:8px; font:500 14px/1 var(--font-sans)}
html[lang="ar"] .rating{font-family:var(--font-arabic)}
.rating b{font-weight:700; font-size:17px}
.stars{display:inline-flex; gap:2px}
.stars svg{width:16px; height:16px; fill:var(--saffron)}
.open{display:inline-flex; align-items:center; gap:8px; font:600 13px/1 var(--font-sans); color:var(--indigo)}
html[lang="ar"] .open{font-family:var(--font-arabic)}
.open::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--cobalt); box-shadow:0 0 0 4px color-mix(in srgb, var(--cobalt) 20%, transparent)}
.open.closed{color:var(--ink-muted)}
.open.closed::before{background:var(--ink-muted); box-shadow:none}
.hero-art{position:relative; aspect-ratio:4/4.6; max-width:520px; justify-self:end; width:100%}
.arch{position:absolute; inset:0; border-radius:var(--radius-arch) var(--radius-arch) var(--radius-lg) var(--radius-lg); background:var(--sand); overflow:hidden}
.arch .ornament{position:absolute; left:50%; translate:-50% 0; width:120%; opacity:.18; background:var(--indigo)}
.arch .ornament.o1{top:-6%; rotate:180deg}
.arch .ornament.o2{bottom:-8%}
.hero-art img{height:auto}
.hero-art .dish-main{position:absolute; left:-4%; top:20%; width:100%; filter:drop-shadow(0 18px 18px rgba(26,42,51,.12))}
.hero-art .dish-side{position:absolute; width:44%; bottom:-3%; inset-inline-end:-7%; filter:drop-shadow(0 12px 14px rgba(26,42,51,.14))}
.hero-art .stamp{position:absolute; top:13%; inset-inline-start:-4%; background:var(--indigo); color:var(--on-indigo); border-radius:var(--radius-pill); padding:10px 16px; font:600 12px/1.2 var(--font-sans); box-shadow:var(--shadow-lift)}
html[lang="ar"] .hero-art .stamp{font-family:var(--font-arabic)}

/* section heads */
section{padding-block:var(--space-16)}
.sec-head{display:flex; align-items:flex-end; justify-content:space-between; gap:var(--space-6); margin-bottom:var(--space-8); flex-wrap:wrap}
.sec-head h2{font-size:clamp(34px,4.4vw,48px); line-height:1.05; color:var(--indigo); margin-top:var(--space-2)}
html[lang="ar"] .sec-head h2{line-height:1.35}
.sec-head p{max-width:30em; margin:0; color:var(--ink-muted)}

/* hits strip */
.hits{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:var(--space-4)}
.hit{display:flex; flex-direction:column; gap:var(--space-3); border:0; padding:0; background:none; color:inherit; text-align:start; cursor:pointer; font:inherit}
.hit-photo{position:relative; aspect-ratio:4/5; border-radius:var(--radius-arch) var(--radius-arch) var(--radius-lg) var(--radius-lg); background:var(--sand); display:grid; place-items:center; transition:transform .2s ease, box-shadow .2s ease}
.hit:hover .hit-photo{transform:translateY(-3px); box-shadow:var(--shadow-lift)}
.hit-photo img{width:92%}
.hit-name{font:400 22px/1.1 var(--font-display); color:var(--ink)}
html[lang="ar"] .hit-name{font:600 17px/1.5 var(--font-arabic)}
.hit-meta{display:flex; justify-content:space-between; align-items:center; gap:8px}
.price{font:700 15px/1 var(--font-sans); font-variant-numeric:tabular-nums; color:var(--indigo); white-space:nowrap}
.hit-photo .badge{position:absolute; top:22%; inset-inline-start:10px}

/* menu */
.menu-sec{background:var(--paper-raised); border-radius:var(--radius-lg) var(--radius-lg) 0 0; box-shadow:var(--shadow-sheet)}
.cats{display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:var(--space-3); margin-bottom:var(--space-8)}
.cat{position:relative; display:flex; flex-direction:column; justify-content:flex-end; aspect-ratio:4/5.2; padding:var(--space-3); border-radius:96px 96px var(--radius-md) var(--radius-md); background:var(--sand); overflow:hidden; text-decoration:none; color:var(--ink); border:0; cursor:pointer; font:inherit; text-align:start; transition:transform .2s ease, box-shadow .2s ease}
.cat:hover{transform:translateY(-3px); box-shadow:var(--shadow-lift)}
.cat img{position:absolute; left:6%; top:16%; width:88%; height:52%; object-fit:contain}
.cat.alt{background:var(--indigo); color:var(--on-indigo)}
.cat.alt .ornament{position:absolute; left:50%; top:20%; width:120%; translate:-50% 0; background:var(--on-indigo); opacity:.35}
.cat-name{position:relative; font:400 19px/1.05 var(--font-display)}
html[lang="ar"] .cat-name{font:600 14px/1.4 var(--font-arabic)}
.cat-count{position:relative; margin-top:4px; font:500 11px/1 var(--font-sans); opacity:.75}
html[lang="ar"] .cat-count{font-family:var(--font-arabic)}

.menubar{position:sticky; top:68px; z-index:20; background:var(--paper-raised); padding-top:var(--space-3); margin-inline:calc(-1 * var(--gutter)) calc(-1 * var(--gutter-r)); padding-inline:var(--gutter) var(--gutter-r)}
.menubar-row{display:flex; gap:var(--space-3); align-items:center}
.search{flex:1; min-width:0; display:flex; align-items:center; gap:var(--space-2); height:46px; padding:0 var(--space-4); border-radius:var(--radius-pill); background:var(--paper); box-shadow:inset 0 0 0 1px var(--hairline); color:var(--ink-muted)}
.search input{flex:1; min-width:0; border:0; background:transparent; outline:none; color:var(--ink); font:400 16px/1 var(--font-sans)}
html[lang="ar"] .search input{font-family:var(--font-arabic)}
.search input::placeholder{color:var(--ink-muted)}
.viewtoggle{display:flex; gap:2px; padding:3px; border-radius:var(--radius-pill); background:var(--paper); box-shadow:inset 0 0 0 1px var(--hairline)}
.viewtoggle button{display:grid; place-items:center; width:40px; height:40px; border:0; border-radius:50%; background:none; color:var(--ink-muted); cursor:pointer}
.viewtoggle button[aria-pressed="true"]{background:var(--indigo); color:var(--on-indigo)}
.tabs{display:flex; gap:var(--space-6); overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--hairline); margin-top:var(--space-2)}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none; padding:var(--space-3) 0; border:0; background:none; color:var(--ink-muted); font:600 14px/1.2 var(--font-sans); cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1px}
html[lang="ar"] .tab{font-family:var(--font-arabic)}
.tab[aria-selected="true"]{color:var(--indigo); border-bottom-color:var(--indigo)}

.mcat{padding-top:var(--space-8)}
.mcat h3{font-size:30px; line-height:1.1; color:var(--indigo); margin-bottom:var(--space-4); display:flex; align-items:baseline; gap:var(--space-3)}
html[lang="ar"] .mcat h3{font-size:24px; line-height:1.5}
.mcat h3 small{font:500 13px/1 var(--font-sans); color:var(--ink-muted)}
.grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:var(--space-6) var(--space-4)}
.dish{display:flex; flex-direction:column; gap:var(--space-2); border:0; padding:0; background:none; color:inherit; text-align:start; cursor:pointer; font:inherit}
.dish-photo{position:relative; aspect-ratio:1; border-radius:var(--radius-md); background:var(--sand); display:grid; place-items:center; overflow:hidden; transition:box-shadow .2s ease}
.dish:hover .dish-photo{box-shadow:var(--shadow-lift)}
.dish-photo img{width:90%; height:90%; object-fit:contain}
.dish-photo .badges{position:absolute; top:var(--space-2); inset-inline-start:var(--space-2); display:flex; gap:4px; flex-wrap:wrap}
.ph{width:100%; height:100%; display:grid; place-items:center; color:var(--indigo)}
.ph svg{width:56%; height:56%}
.ph text{font-family:var(--font-display); fill:var(--indigo)}
.dish-name{font:600 15px/20px var(--font-sans)}
html[lang="ar"] .dish-name{font-family:var(--font-arabic); line-height:24px}
.dish-sub{font:500 13px/18px var(--font-sans); color:var(--ink-muted)}
html[lang="ar"] .dish-sub{font-family:var(--font-sans)}
.dish-row{display:none}
.list .grid{display:flex; flex-direction:column; gap:0}
.list .dish{display:grid; grid-template-columns:84px minmax(0,1fr) auto; gap:var(--space-4); align-items:center; padding:var(--space-3) 0; border-bottom:1px solid var(--hairline)}
.list .dish-photo{width:84px}
.list .dish-photo .badges{display:none}
.list .dish-body{display:flex; flex-direction:column; gap:3px; min-width:0}
.list .dish-comp{display:block}
.dish-comp{display:none; font:400 13px/18px var(--font-sans); color:var(--ink-muted)}
html[lang="ar"] .dish-comp{font-family:var(--font-arabic); line-height:22px}
.dish-body{display:flex; flex-direction:column; gap:4px}
.list .price{font-size:16px}
.empty{padding:var(--space-12) 0; text-align:center; color:var(--ink-muted)}

/* dish sheet */
dialog.sheet{border:0; padding:0; margin:auto auto 0; width:min(560px,100%); max-height:92vh; border-radius:var(--radius-lg) var(--radius-lg) 0 0; background:var(--paper-raised); color:var(--ink); box-shadow:var(--shadow-sheet)}
@media (min-width:720px){ dialog.sheet{margin:auto; border-radius:var(--radius-lg)} }
dialog.sheet::backdrop{background:rgba(15,34,48,.55)}
.sheet-photo{position:relative; aspect-ratio:16/11; background:var(--sand); display:grid; place-items:center; border-radius:inherit; border-end-start-radius:0; border-end-end-radius:0; overflow:hidden}
.sheet-photo img{width:80%; max-height:92%; object-fit:contain}
.sheet-close{position:absolute; top:14px; inset-inline-end:14px; width:40px; height:40px; border-radius:50%; border:0; background:var(--paper-raised); color:var(--ink); display:grid; place-items:center; cursor:pointer; box-shadow:var(--shadow-lift)}
.sheet-body{padding:var(--space-6); display:flex; flex-direction:column; gap:var(--space-3); padding-bottom:calc(var(--space-6) + env(safe-area-inset-bottom,0px))}
.sheet-body h3{font-size:34px; line-height:1.05; color:var(--indigo)}
html[lang="ar"] .sheet-body h3{font-size:26px; line-height:1.5}
.sheet-alt{font:500 14px/1.4 var(--font-sans); color:var(--ink-muted)}
.sheet-foot{display:flex; align-items:center; justify-content:space-between; gap:var(--space-4); margin-top:var(--space-3); flex-wrap:wrap}
.sheet-foot .price{font-size:22px}

/* services */
.svc{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:var(--space-4)}
.svc-item{display:flex; flex-direction:column; gap:var(--space-3); padding:var(--space-8) var(--space-6) var(--space-6); border-radius:var(--radius-arch) var(--radius-arch) var(--radius-lg) var(--radius-lg); background:var(--sand); min-height:280px}
.svc-item.indigo{background:var(--indigo); color:var(--on-indigo)}
.svc-item.indigo .muted{color:var(--on-indigo); opacity:.82}
.svc-item .ico{width:34px; height:34px; stroke-width:1.5; color:var(--indigo); margin:var(--space-6) auto var(--space-2)}
.svc-item.indigo .ico{color:var(--on-indigo)}
.svc-item h3{font-size:28px; line-height:1.1; text-align:center}
html[lang="ar"] .svc-item h3{font-size:21px; line-height:1.5}
.svc-item p{margin:0; text-align:center}
.svc-item .btn{align-self:center; margin-top:auto}
.svc-item.indigo .btn-ghost{color:var(--on-indigo); border-color:color-mix(in srgb, var(--on-indigo) 40%, transparent)}

/* reviews */
.rev{display:grid; grid-template-columns:minmax(0,.8fr) repeat(3,minmax(0,1fr)); gap:var(--space-4); align-items:stretch}
.rev-score{display:flex; flex-direction:column; justify-content:center; gap:var(--space-2)}
.rev-score .big{font:400 96px/.9 var(--font-display); color:var(--indigo)}
.rev-card{margin:0; padding:var(--space-6); border-radius:var(--radius-lg); background:var(--paper-raised); box-shadow:inset 0 0 0 1px var(--hairline); display:flex; flex-direction:column; gap:var(--space-4)}
.rev-card blockquote{margin:0; font:400 21px/1.3 var(--font-display); color:var(--ink)}
html[lang="ar"] .rev-card blockquote{font:400 16px/1.8 var(--font-arabic)}
.rev-card figcaption{margin-top:auto; font:600 13px/1.3 var(--font-sans)}
html[lang="ar"] .rev-card figcaption{font-family:var(--font-arabic)}
.rev-card figcaption span{display:block; font-weight:500; color:var(--ink-muted); margin-top:2px}

/* visit */
.visit{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:var(--space-6)}
.visit-card{padding:var(--space-8); border-radius:var(--radius-lg); background:var(--indigo); color:var(--on-indigo); display:flex; flex-direction:column; gap:var(--space-4); position:relative; overflow:hidden}
.visit-card .ornament{position:absolute; width:520px; inset-inline-end:-140px; bottom:-60px; background:var(--on-indigo); opacity:.1}
.visit-card h2{font-size:clamp(34px,4vw,46px); line-height:1.05}
html[lang="ar"] .visit-card h2{line-height:1.4}

footer{padding-block:var(--space-12) calc(var(--space-12) + 72px); border-top:1px solid var(--hairline)}

.sheet-foot .price{flex-basis:100%}

.cart-fab{position:fixed; z-index:40; inset-inline-end:max(24px, env(safe-area-inset-right,0px)); bottom:calc(24px + env(safe-area-inset-bottom,0px)); display:flex; align-items:center; gap:12px; min-height:56px; padding:0 24px; border:0; border-radius:var(--radius-pill); background:var(--pomegranate); color:var(--on-pomegranate); font:600 15px/1 var(--font-sans); box-shadow:var(--shadow-lift); cursor:pointer}

dialog.checkout{width:min(640px,100%)}
dialog.sheet{overflow:auto; overscroll-behavior:contain}
.co{display:flex; flex-direction:column; gap:var(--space-4); padding:var(--space-6) var(--space-6) 0}
.co-head{display:flex; align-items:center; justify-content:space-between}
.co-head h3{font-size:32px; color:var(--indigo)}

.co-close{position:static}
.co-items{display:flex; flex-direction:column}
.co-item{display:grid; grid-template-columns:52px minmax(0,1fr) auto auto; gap:var(--space-3); align-items:center; padding:var(--space-2) 0; border-bottom:1px solid var(--hairline)}
.co-thumb{width:52px; height:52px; border-radius:12px; background:var(--sand); display:grid; place-items:center; overflow:hidden}
.co-thumb img{width:90%; height:90%; object-fit:contain}
.co-name{font:600 14px/1.3 var(--font-sans); min-width:0}
html[lang="ar"] .co-name{font-family:var(--font-arabic)}
.co-name small{display:block; font-weight:500; color:var(--ink-muted); margin-top:2px}
.co-item .price{min-width:64px; text-align:end}

.seg input{position:absolute; opacity:0; inset:0; cursor:pointer}
.seg label:has(input:checked){background:var(--paper-raised); color:var(--indigo); box-shadow:0 2px 8px rgba(26,42,51,.08)}
.seg label:has(input:focus-visible){outline:2px solid var(--focus); outline-offset:2px}
.co-block{border:0; margin:0; padding:0; display:flex; flex-direction:column; gap:var(--space-3); min-width:0}
.co-legend{padding:0; margin-bottom:var(--space-1); font:600 11px/14px var(--font-sans); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-muted)}

.f{display:flex; flex-direction:column; gap:6px; min-width:0}
.f2{display:grid; grid-template-columns:1fr 1fr; gap:var(--space-3)}

html[lang="ar"] .f input, html[lang="ar"] .f textarea{font-family:var(--font-arabic)}
.f textarea{padding:12px 14px; resize:vertical}
.f input:focus, .f select:focus, .f textarea:focus, .phone:focus-within{outline:2px solid var(--focus); outline-offset:1px}
.f [aria-invalid="true"]{box-shadow:inset 0 0 0 1.5px var(--pomegranate)}
.phone{display:flex; align-items:center; gap:10px; padding:0 0 0 14px; direction:ltr}
.phone span{font-weight:600; color:var(--ink-muted)}
.phone input{flex:1; min-width:0; min-height:46px; border:0; background:none; color:var(--ink); font:400 16px/1 var(--font-sans); outline:none; box-shadow:none; padding:0 14px 0 0}
.help{margin:0; font-size:12px; line-height:1.4; color:var(--ink-muted)}
.co-err{margin:0; font:600 12px/1.4 var(--font-sans); color:var(--pomegranate)}
.co-warn{margin:0; padding:10px 12px; border-radius:var(--radius-sm); background:var(--sand); font-size:13px; line-height:1.4}
.co-pickup{margin:0; padding:14px; border-radius:var(--radius-sm); background:var(--sand)}
.combo{position:relative}
.combo-list{position:absolute; z-index:5; inset-inline:0; top:calc(100% + 6px); margin:0; padding:6px; list-style:none; max-height:260px; overflow:auto; border-radius:var(--radius-md); background:var(--paper-raised); box-shadow:0 12px 32px rgba(15,34,48,.18), inset 0 0 0 1px var(--hairline)}
.combo-list li{display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:10px 12px; border-radius:10px; cursor:pointer}
.combo-list li span{font-weight:600}
.combo-list li small{color:var(--ink-muted); white-space:nowrap}
.combo-list li:hover, .combo-list li.on{background:var(--sand)}
.combo-list .combo-none{cursor:default; color:var(--ink-muted); font-size:13px}
.locate{align-self:flex-start; display:inline-flex; align-items:center; gap:8px; padding:6px 0; border:0; background:none; color:var(--cobalt); font:600 13px/1.3 var(--font-sans); cursor:pointer; text-align:start}
html[lang="ar"] .locate{font-family:var(--font-arabic)}
.locate .ico{width:18px; height:18px}
.co-foot{display:flex; flex-direction:column; gap:var(--space-3); position:sticky; bottom:0; margin:0 calc(-1 * var(--space-6)); padding:var(--space-4) var(--space-6) calc(var(--space-4) + env(safe-area-inset-bottom,0px)); background:var(--paper-raised); border-top:1px solid var(--hairline)}
.co-foot .btn{width:100%; min-height:54px}
.mapbox{position:relative; display:flex; flex-direction:column; gap:8px}
.map{height:220px; border-radius:var(--radius-md); overflow:hidden; background:var(--sand); box-shadow:inset 0 0 0 1px var(--hairline)}
.map-pin{position:absolute; left:50%; top:110px; width:30px; height:40px; transform:translate(-50%,-100%); pointer-events:none; filter:drop-shadow(0 4px 4px rgba(15,34,48,.35))}
.map-pin svg{width:100%; height:100%}
.map-pin path{fill:var(--pomegranate)}
.map-pin circle{fill:var(--on-pomegranate)}
@media (max-width:860px){ .cart-fab{display:none} }
@media (max-width:560px){ .f2{grid-template-columns:1fr} .co{padding:var(--space-4) var(--space-4) 0} .co-foot{margin-inline:calc(-1 * var(--space-4)); padding-inline:var(--space-4)} }

@media (max-width:1080px){
  .cats{grid-template-columns:repeat(4,minmax(0,1fr))}

}
@media (max-width:860px){
  .nav{display:none}

  .svc{grid-template-columns:1fr}
  .svc-item{min-height:0}

  .visit{grid-template-columns:1fr}
  section{padding-block:var(--space-12)}

  .hits{grid-template-columns:repeat(2,minmax(0,1fr))}

  .hero-facts{gap:var(--space-4)}
  .hero-ctas .btn{flex:1}
  .menubar{top:68px}
  .visit-card, .hours{padding:var(--space-6)}
}
@media (prefers-reduced-motion:reduce){ *{transition:none!important} html{scroll-behavior:auto} }

            var on = tb.getAttribute("data-goto") === id;
            tb.setAttribute("aria-selected", on);
            if (on && tb.scrollIntoView) { var p = tb.parentNode; p.scrollTo({left: tb.offsetLeft - p.offsetLeft - 16, behavior: "smooth"}); }
          });
        }
      });
    }, {rootMargin: "-170px 0px -60% 0px"});
    $$(".mcat").forEach(function(s){ io.observe(s); });
  }

  var sheet = $("#sheet");
  /* Freeze the page behind open dialogs (iOS-safe: fix the body and restore the scroll position). */
  var lockN = 0, lockY = 0;
  function lockScroll(){
    if (lockN++) return;
    lockY = window.scrollY || window.pageYOffset || 0;
    var b = document.body.style; b.position = "fixed"; b.top = -lockY + "px"; b.left = "0"; b.right = "0"; b.width = "100%";
    document.documentElement.style.overflow = "hidden";
  }
  function unlockScroll(){
    if (!lockN || --lockN) return;
    var b = document.body.style; b.position = b.top = b.left = b.right = b.width = "";
    document.documentElement.style.overflow = "";
    window.scrollTo({ top: lockY, left: 0, behavior: "instant" });
  }
  sheet.addEventListener("close", unlockScroll);
  function openDish(id){
    var d = byId[id]; if (!d) return;
    var ph = $(".js-sheet-photo");
    $$("img,.ph", ph).forEach(function(n){ n.remove(); });
    ph.insertAdjacentHTML("beforeend", d[3] ? '<img src="' + imgSrc(d[3]) + '" alt="">' : placeholder(d[4][lang]));
    $(".js-sheet-badges").innerHTML = badges(d[6], isOff(d));
    $(".js-sheet-h").textContent = d[4][lang];
    $(".js-sheet-alt").textContent = lang === "ar" ? d[4].en : (lang === "en" ? d[4].ru + " · " + d[4].ar : d[4].en + " · " + d[4].ar);
    $(".js-sheet-comp").textContent = d[5] ? d[5][lang] : "";
    $(".js-sheet-price").textContent = priceText(d[2]);
    window.SM.current = d[0]; if (window.SM.onDishOpen) window.SM.onDishOpen(d[0]);
    if (!sheet.open) lockScroll();
    if (sheet.showModal) sheet.showModal(); else sheet.setAttribute("open", "");
  }
  sheet.addEventListener("click", function(e){ if (e.target === sheet || e.target.closest("[data-close]")) sheet.close(); });

  document.addEventListener("click", function(e){
    var dish = e.target.closest("[data-dish]");
    if (dish) { openDish(dish.getAttribute("data-dish")); return; }
    var go = e.target.closest("[data-goto]");
    if (go) {
      if (query) { query = ""; $("#q").value = ""; renderMenu(); }
      var el = document.getElementById("cat-" + go.getAttribute("data-goto"));
      if (el) el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
      return;
    }
    var lb = e.target.closest("[data-lang]");
    if (lb) { setLang(lb.getAttribute("data-lang")); return; }
    var vb = e.target.closest("[data-view]");
    if (vb) { view = vb.getAttribute("data-view"); $$("[data-view]").forEach(function(b){ b.setAttribute("aria-pressed", b === vb); }); renderMenu(); }
  });
  $("#q").addEventListener("input", function(e){ query = e.target.value.trim().toLowerCase(); renderMenu(); });
  window.addEventListener("scroll", function(){ $("#top").classList.toggle("scrolled", window.scrollY > 8); }, {passive: true});

  function setLang(l){
    if (!T[l]) l = "en";
    lang = l;
    try { localStorage.setItem("sm-lang", l); } catch(_) {}
    applyStatic(); renderHits(); renderCats(); renderMenu();
    if (window.SM.onLang) window.SM.onLang();
  }
  window.SM = { t: t, lang: function(){ return lang; }, byId: byId, priceText: priceText, num: num, esc: esc, wa: wa, WA: WA, placeholder: placeholder, T: T,
    img: imgSrc, isOff: isOff, lock: lockScroll, unlock: unlockScroll, close: function(){ sheet.close(); } };

  /* Live menu from Supabase (admin panel). The bundled menu.js stays as the fallback. */
  function loadLiveMenu(){
    var cfg = window.SM_CONFIG || {};
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey || !window.fetch) return;
    var base = cfg.supabaseUrl.replace(/\/$/, "") + "/rest/v1/";
    var h = { apikey: cfg.supabaseAnonKey };  /* publishable keys go on the apikey header only */
    function get(path){ return fetch(base + path, { headers: h }).then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); }); }
    Promise.all([
      get("categories?select=id,name_ru,name_en,name_ar,sort&visible=eq.true&order=sort.asc"),
      get("dishes?select=id,category_id,price,image_url,name_ru,name_en,name_ar,comp_ru,comp_en,comp_ar,tags,available,sort&visible=eq.true&order=sort.asc")
    ]).then(function(res){
      var cats = res[0], dishes = res[1];
      if (!cats.length || !dishes.length) return;
      window.MENU_CATS = cats.map(function(c){ return { id: c.id, ru: c.name_ru, en: c.name_en, ar: c.name_ar }; });
      window.MENU = dishes.map(function(d){
        var comp = (d.comp_ru || d.comp_en || d.comp_ar) ? { ru: d.comp_ru || d.comp_en || "", en: d.comp_en || d.comp_ru || "", ar: d.comp_ar || d.comp_en || "" } : null;
        return [d.id, d.category_id, Number(d.price), d.image_url || null, { ru: d.name_ru, en: d.name_en, ar: d.name_ar }, comp, d.tags || [], d.available !== false];
      });
      indexMenu();
      setLang(lang);
      if (window.SM.onMenu) window.SM.onMenu();
    }).catch(function(){ /* keep the bundled menu */ });
  }
  var start = "en";
  var hash = (location.hash || "").replace("#", "");
  if (T[hash]) start = hash;
  else {
    try { var s = localStorage.getItem("sm-lang"); if (T[s]) start = s; } catch(_) {}
  }
  setLang(start);
  loadLiveMenu();
  setInterval(updateOpen, 60000);
})();
</script>
<script src="assets/order.js"></script>
</body>
